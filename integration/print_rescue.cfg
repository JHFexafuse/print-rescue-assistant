# Print Rescue 0.1 – profile for config-20260924-122756.zip.
# Requires the homing_override guard installed by install.py.
# V1 deliberately contains no FORCE_MOVE or SET_KINEMATIC_POSITION.

[gcode_macro _PR_STATE]
variable_version: 1
variable_active: 0
variable_phase: 0
variable_token: 0
variable_inspect_z: 0.0
variable_ready_z: 0.0
variable_clearance: 10.0
gcode:

[gcode_macro _PR_ASSERT_Z]
gcode:
    {% if 'z' not in printer.toolhead.homed_axes %}
        {action_raise_error("Print Rescue V1: Z-Referenz fehlt. Kein Homing und keine Bewegung ausgefuehrt.")}
    {% endif %}
    {% for name in ['stepper_z', 'stepper_z1', 'stepper_z2', 'stepper_z3'] %}
        {% if not printer.stepper_enable.steppers[name] %}
            {action_raise_error("Print Rescue V1: Z-Motor nicht bestromt. Referenz muss zuerst ausserhalb von V1 wiederhergestellt werden.")}
        {% endif %}
    {% endfor %}

[gcode_macro PR_INSPECT]
description: Ausgewaehlte Hoehe anfahren und ausschliesslich X/Y freigeben
gcode:
    {% set R = printer['gcode_macro _PR_STATE'] %}
    {% set z = params.Z|float %}
    {% set token = params.TOKEN|int %}
    {% if R.active|int != 0 or R.phase|int != 0 %}
        {action_raise_error("Print Rescue: Zuerst die aktuelle Pruefung beenden.")}
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Print Rescue: Den bisherigen Druckauftrag zuerst abbrechen.")}
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Print Rescue V1: Vor Beginn muessen XYZ gueltig referenziert sein.")}
    {% endif %}
    {% if token < 1 or token > 2147483647 or not z >= 0 or not z <= printer.toolhead.axis_maximum.z - 20 %}
        {action_raise_error("Print Rescue: Ungueltige Hoehe oder Sitzung; mindestens 20 mm Hoehenreserve erforderlich.")}
    {% endif %}
    {% if printer.exclude_object.excluded_objects|length > 0 %}
        {action_raise_error("Print Rescue V1: Ausgeschlossene Objekte werden noch nicht uebernommen.")}
    {% endif %}
    _PR_ASSERT_Z
    M400
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=token VALUE={token}
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=inspect_z VALUE={z}
    SAVE_GCODE_STATE NAME=_PR_INSPECT_GCODE
    BED_MESH_PROFILE LOAD=PETG
    G90
    M220 S100
    G1 Z{z} F300
    M400
    RESTORE_GCODE_STATE NAME=_PR_INSPECT_GCODE MOVE=0
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=1
    SET_PIN PIN=_STEPPER_RESET VALUE=0
    M400
    RESPOND PREFIX="RESCUE" MSG="Hoehe erreicht. Nur X/Y sind frei. Z bleibt bestromt."

[gcode_macro PR_CONFIRM]
description: Handpruefung bestaetigen, Z-Abstand herstellen und nur X/Y homen
gcode:
    {% set R = printer['gcode_macro _PR_STATE'] %}
    {% set cancel = params.CANCEL|default(0)|int %}
    {% if R.active|int != 1 or R.phase|int != 1 or params.TOKEN|int != R.token|int %}
        {action_raise_error("Print Rescue: Keine passende aktive Handpruefung.")}
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Print Rescue: Ein anderer Druckauftrag ist aktiv.")}
    {% endif %}
    {% if (printer.gcode_move.gcode_position.z - R.inspect_z|float)|abs > 0.02 %}
        {action_raise_error("Print Rescue: Z wurde seit der Pruefung veraendert. Sitzung kann nicht fortgesetzt werden.")}
    {% endif %}
    {% if printer.toolhead.position.z + R.clearance|float > printer.toolhead.axis_maximum.z %}
        {action_raise_error("Print Rescue: Nicht genug Platz fuer den Abstand vor XY-Homing.")}
    {% endif %}
    _PR_ASSERT_Z
    M400
    SET_PIN PIN=_STEPPER_RESET VALUE=1
    G4 P30
    SAVE_GCODE_STATE NAME=_PR_CONFIRM_GCODE
    M220 S100
    G91
    G1 Z{R.clearance|float} F300
    G90
    M400
    _PR_ASSERT_Z
    G28 X
    M400
    RESTORE_GCODE_STATE NAME=_PR_CONFIRM_GCODE MOVE=0
    _PR_AFTER_HOME CANCEL={cancel}

[gcode_macro _PR_AFTER_HOME]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Print Rescue: XY-Homing wurde nicht erfolgreich abgeschlossen.")}
    {% endif %}
    _PR_ASSERT_Z
    {% if params.CANCEL|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=token VALUE=0
        RESPOND PREFIX="RESCUE" MSG="Pruefung beendet. XY referenziert, Z erhalten."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=ready_z VALUE={printer.gcode_move.gcode_position.z}
        SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=2
        RESPOND PREFIX="RESCUE" MSG="XY referenziert. Bereit fuer die zur Sitzung gehoerende Reparaturdatei."
    {% endif %}

[gcode_macro PR_START]
description: Geschuetzter Start einer erzeugten Reparaturdatei ohne PRINT_START
gcode:
    {% set R = printer['gcode_macro _PR_STATE'] %}
    {% set hot = params.HOTEND|float %}
    {% set bed = params.BED|float %}
    {% if R.active|int != 1 or R.phase|int != 2 or params.TOKEN|int != R.token|int %}
        {action_raise_error("Print Rescue: Reparaturdatei gehoert nicht zu einer bestaetigten Sitzung. Erneut im Assistenten vorbereiten.")}
    {% endif %}
    {% if (params.LAST_Z|float - R.inspect_z|float)|abs > 0.001 %}
        {action_raise_error("Print Rescue: Pruefhoehe und Reparaturdatei stimmen nicht ueberein.")}
    {% endif %}
    {% if not params.NEXT_Z|float > R.inspect_z|float or not params.NEXT_Z|float < printer.gcode_move.gcode_position.z %}
        {action_raise_error("Print Rescue: Ungueltige Wiederanlaufhoehe oder zu wenig Abstand.")}
    {% endif %}
    {% if not hot >= 140 or not hot <= 315 or not bed >= 0 or not bed <= 105 %}
        {action_raise_error("Print Rescue: Temperatur ausserhalb des geprueften Profils.")}
    {% endif %}
    _PR_PRINT_CHECK
    M140 S{bed}
    M104 S{hot}
    M190 S{bed}
    M109 S{hot}
    _PR_PRINT_CHECK
    CLEAR_PAUSE
    SET_FILAMENT_SENSOR SENSOR=O2_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=my_sensor ENABLE=1
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=last_active_temp VALUE={hot}
    SET_GCODE_VARIABLE MACRO=preflight_state VARIABLE=ready_to_print VALUE=1
    SET_GCODE_VARIABLE MACRO=preflight_state VARIABLE=print_temp VALUE={hot}
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=3
    M117 Print Rescue startet mit 20 Prozent

[gcode_macro _PR_PRINT_CHECK]
gcode:
    {% set R = printer['gcode_macro _PR_STATE'] %}
    {% if printer.toolhead.homed_axes != 'xyz' or R.phase|int != 2 %}
        {action_raise_error("Print Rescue: Referenz oder Sitzungszustand wurde geaendert.")}
    {% endif %}
    {% if printer['output_pin _STEPPER_RESET'].value|float != 1.0 %}
        {action_raise_error("Print Rescue: XY-Motoren sind nicht eingeschaltet.")}
    {% endif %}
    {% if (printer.gcode_move.gcode_position.z - R.ready_z|float)|abs > 0.02 %}
        {action_raise_error("Print Rescue: Z wurde nach der Bestaetigung veraendert.")}
    {% endif %}
    {% if printer.bed_mesh.profile_name != 'PETG' %}
        {action_raise_error("Print Rescue: Das erwartete PETG-Mesh ist nicht geladen.")}
    {% endif %}
    _PR_ASSERT_Z

[gcode_macro PR_FINISH]
description: Reparatursitzung beenden und vorhandenes PRINT_END ausfuehren
gcode:
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=token VALUE=0
    PRINT_END

[gcode_macro PR_UNLOCK_XY]
description: Nur XY wieder bestromen, keine Bewegung oder Referenzierung
gcode:
    M400
    SET_PIN PIN=_STEPPER_RESET VALUE=1
    RESPOND PREFIX="RESCUE" MSG="XY bestromt. Nach Handbewegung bleiben XY unzuverlaessig bis zum Homing. Die Sitzungssperre bleibt aktiv."

[gcode_macro PR_DISCARD]
description: Inaktive Sitzung mit gueltigen Referenzen ohne Bewegung verwerfen
gcode:
    {% set R = printer['gcode_macro _PR_STATE'] %}
    {% if R.phase|int == 1 %}
        {action_raise_error("Print Rescue: Handpruefung zuerst mit PR_CONFIRM CANCEL=1 beenden.")}
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Print Rescue: Druckauftrag zuerst abbrechen.")}
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' or printer['output_pin _STEPPER_RESET'].value|float != 1.0 %}
        {action_raise_error("Print Rescue: Referenz fehlt oder XY ist frei. Sitzung bleibt gesperrt.")}
    {% endif %}
    _PR_ASSERT_Z
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PR_STATE VARIABLE=token VALUE=0
    RESPOND PREFIX="RESCUE" MSG="Reparatursitzung verworfen. Keine Bewegung ausgefuehrt."
