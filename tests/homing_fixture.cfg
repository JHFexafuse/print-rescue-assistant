[homing_override]
axes: xyz
gcode:
    {% set V      = printer["gcode_macro _EQGL_VARS"] %}
    {% set th     = printer.toolhead %}
    {% set zx     = V.home_x|float %}
    {% set zy     = V.home_y|float %}
    {% set hop    = V.home_z_hop|float %}
    {% set fhop   = (V.home_z_hop_speed|float * 60)|round(0)|int %}
    {% set fxy    = (V.home_speed|float * 60)|round(0)|int %}
    {% set want_x = 'X' in params %}
    {% set want_y = 'Y' in params %}
    {% set want_z = 'Z' in params %}
    {% set all_ax = not (want_x or want_y or want_z) %}
    {% set do_x   = all_ax or want_x %}
    {% set do_y   = all_ax or want_y %}
    {% set z_cold = 'z' not in th.homed_axes %}
    {% set do_z   = all_ax or want_z or z_cold %}

    SAVE_GCODE_STATE NAME=_G28_STATE
    G90

    # --- Z-Hop, wie [safe_z_home] ---
    {% if z_cold %}
    SET_KINEMATIC_POSITION Z=0
    G0 Z{hop} F{fhop}
    {% elif th.position.z|float < hop %}
    G0 Z{hop} F{fhop}
    {% endif %}

    # --- X und Y ueber die Endstops ---
    {% if do_x or do_y %}
    G28.1{% if do_x %} X{% endif %}{% if do_y %} Y{% endif %}
    {% endif %}

    # --- Z ---
    {% if do_z %}
        {% if not (do_x or do_y) and ('x' not in th.homed_axes or 'y' not in th.homed_axes) %}
        { action_raise_error("Must home X and Y axes first") }
        {% endif %}
    # Stelle sofort auf die Vorgabe zuruecksetzen: eine Umstellung durch
    # EMERGENCY_HOME gilt damit garantiert nur fuer diesen einen Lauf.
    _RESET_ZHOME_POS
        {% if zx != V.home_x_default|float or zy != V.home_y_default|float %}
    RESPOND PREFIX="G28" MSG="Z-Homing ausnahmsweise bei X{zx} Y{zy} statt X{V.home_x_default} Y{V.home_y_default}."
        {% endif %}
    G0 X{zx} Y{zy} F{fxy}
    G28.1 Z
    G91
    G0 Z{hop} F{fhop}
    G90
    {% endif %}

    RESTORE_GCODE_STATE NAME=_G28_STATE MOVE=0

#--------------------------------------------------------------------

[gcode_macro g28]
rename_existing: G28.1
gcode:
    # Wenn X oder Y angefordert ist, werden immer X UND Y gehomed.
    # Bei G28 ohne Achsen (alles homing) bleibt das Verhalten wie gewohnt.
    {% set rp = rawparams|default("", true)|upper|trim %}
    {% set tokens = rp.split() %}
    {% set want_x = "X" in tokens %}
    {% set want_y = "Y" in tokens %}
    {% set want_z = "Z" in tokens %}

    # Reset-Puls nur, wenn XY gehomed werden (explizit oder implizit bei "G28" ohne Parameter)
    {% set home_xy = (rp == "") or want_x or want_y %}
    {% if home_xy %}
        SET_PIN PIN=_STEPPER_RESET VALUE=0
        G4 P15
        SET_PIN PIN=_STEPPER_RESET VALUE=1
        G4 P30
    {% endif %}

    # Finalen Parameter-String aufbauen:
    # - Ohne Parameter: G28 (alles)
    # - Mit X oder Y: immer "X Y" (plus evtl. "Z", falls angefordert)
    # - Nur Z: nur "Z"
    {% if rp == "" %}
        # Home all
        G28.1
    {% else %}
        {% set final = "" %}
        {% if want_x or want_y %}
            {% set final = final + " X Y" %}
        {% endif %}
        {% if want_z %}
            {% set final = final + " Z" %}
        {% endif %}
        {% if final|trim == "" %}
            # Keine bekannten Achsen erkannt -> roh durchreichen (Fallback)
            G28.1 {rawparams}
        {% else %}
            G28.1{final}
        {% endif %}
    {% endif %}

#####################################################################
# 	BEDMESH
#####################################################################
